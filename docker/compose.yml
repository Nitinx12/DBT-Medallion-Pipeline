x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  env_file:
    - ../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    # Local-dev-only shared secrets so scheduler/apiserver mint and verify the
    # same Execution API JWTs. When unset, Airflow 3.3 autogenerates these per
    # container, so any independent recreate breaks JWT verification (403
    # "Signature verification failed"). Move to a secret store for real deploys.
    AIRFLOW__API__SECRET_KEY: "TMYZ78E8I5GFojcAoJ6KV4GT0Qs2qnJ3o8S-5UpgseU"
    AIRFLOW__API_AUTH__JWT_SECRET: "V2dbfyEcbPYodgceY-rfTz8k_DyskA9SoaNj790ik-c"
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/logs:/opt/airflow/logs
    - ../airflow/plugins:/opt/airflow/plugins
    - ..:/app
    - /app/.venv
  extra_hosts:
    - "host.docker.internal:host-gateway"
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-metadata:
      condition: service_healthy

services:
  airflow-metadata:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-metadata:
        condition: service_healthy
      airflow-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

  airflow-migrate:
    <<: *airflow-common
    command: db migrate
    depends_on:
      airflow-metadata:
        condition: service_healthy
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-metadata:
        condition: service_healthy
      airflow-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always

volumes:
  airflow-metadata:
