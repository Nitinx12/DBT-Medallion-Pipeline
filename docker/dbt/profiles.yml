# Target location: docker/dbt/profiles.yml
#
# Project-scoped copy of the walmart_dbt entry from the global
# ~/.dbt/profiles.yml. Not a bind-mount of that file on purpose -- the
# global file holds credentials/tokens for several unrelated projects
# (banking_dbt, bike_project, datawarehouse, etc.) that have no business
# being visible inside this container or committed to this repo.
#
# Only real change from the global entry: `host` uses the same
# env_var(...) pattern the global file's retail_data_warehouse profile
# already uses, defaulting to localhost so this also works unmodified for
# any local (non-container) dbt runs that point DBT_PROFILES_DIR here.
# The DAG's _PREAMBLE exports POSTGRES_HOST=host.docker.internal before
# dbt runs, so inside the container this resolves correctly automatically.
walmart_dbt:
  outputs:
    dev:
      dbname: "{{ env_var('POSTGRES_DATABASE', 'walmart_db') }}"
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      # Same var names as utils/engine.py (POSTGRES_USERNAME/PASSWORD) so a
      # single .env drives both the Python pipeline and dbt. Defaults match
      # the local dev Postgres the README sets up.
      pass: "{{ env_var('POSTGRES_PASSWORD', 'admin') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      schema: "{{ env_var('POSTGRES_SCHEMA_BRONZE', 'bronze') }}"
      threads: 4
      type: postgres
      user: "{{ env_var('POSTGRES_USERNAME', 'postgres') }}"

    ci:
      type: postgres
      host: localhost
      port: 5432
      user: walmart
      pass: walmart
      dbname: walmart_db
      schema: public
      threads: 4

  target: dev
