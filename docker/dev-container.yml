services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    volumes:
      - ..:/app
      - devcontainer-venv:/app/.venv
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["sleep", "infinity"]
    working_dir: /app

volumes:
  devcontainer-venv:
