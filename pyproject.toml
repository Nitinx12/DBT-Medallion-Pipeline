[project]
name = "walmart"
version = "0.2.0"
description = "Walmart Medallion Data Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apache-airflow>=3.3.1",
    "databricks-sql-connector>=4.4.0",
    "dbt-core>=1.12.0",
    "dbt-postgres>=1.11.0",
    "great-expectations>=1.21.0",
    "pandas>=3.0.5",
    "pendulum>=3.0.0",
    "plotly>=7.0.0",
    "polars>=1.0.0",
    "psycopg2-binary>=2.9.12",
    "pymongo>=4.17.0",
    "pyspark==3.5.5",
    "python-dotenv>=1.2.2",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "pandas>=3.0.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "sqlfluff>=4.2.2",
    "sqlfluff-templater-dbt>=4.2.2",
]


[tool.ruff.lint.per-file-ignores]
"dashboard/home.py" = ["E402"]
"src/jobs/extract.py" = ["E402"]
"scripts/inspect_gold_schema.py" = ["E402"]
"scripts/seed_demo_db.py" = ["E402"]
"scripts/sync_gold_to_databricks.py" = ["E402"]
# DAGs must never fail on import (broad timetable fallback) and build bash
# via .format() so ${...} is not doubled as f-strings would require.
"airflow/dags/*.py" = ["BLE001", "UP030", "UP032"]
# Smoke tests intentionally swallow connection errors into pytest.skip,
# and check subprocess return codes manually.
"tests/smoke/*.py" = ["BLE001", "PLW1510"]
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/smoke"]
addopts = "-v --cov=src --cov=scripts --cov-report=term-missing"

[tool.coverage.run]
source = ["src", "scripts"]
omit = ["src/*/__pycache__/*", "scripts/__pycache__/*"]

# Scripts layout (flattened 2026-10): flat scripts/*.py + scripts/*.sh;
# pipeline runtime lives in src/jobs/.
