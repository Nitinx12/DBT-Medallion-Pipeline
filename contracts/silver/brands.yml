apiVersion: 1.0.0
kind: DataContract
metadata:
  name: silver.brands
  layer: silver
  version: 1.0.0
  status: active
  owner: analytics-engineering
  domain: retail-warehouse
  description: Append-only brand dimension. Surrogate brand_id via ROW_NUMBER ordered
    by name; ids never reassigned.
dataset:
  server: postgres-prod
  database: walmart_db
  schema: silver
  table: brands
  grain: brand_id unique; brand_name unique
  upstream: bronze.products.brand
  dbtModel: dbt/models/silver/brands.sql
  loadStrategy: incremental append (only new names)
  row_count: 8
  column_count_contract: 3
  column_count_observed: 3
  table_exists: true
  last_observed_at: '2026-10-13T14:51:42+00:00'
columns:
- name: brand_id
  data_type: BIGINT
  nullable: true
  unique: true
  primary_key: true
  transformation: MAX(brand_id) + ROW_NUMBER() OVER (ORDER BY brand_name)
  tests:
  - not_null
  - unique
  observed_data_type: BIGINT
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 8
  sync_status: ok
- name: brand_name
  data_type: TEXT
  nullable: true
  unique: true
  transformation: DISTINCT INITCAP(TRIM(brand::VARCHAR)) WHERE brand IS NOT NULL AND
    TRIM <> ''
  tests:
  - not_null
  - unique
  observed_data_type: TEXT
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 8
  sync_status: ok
- name: silver_loaded_at
  data_type: TIMESTAMPTZ
  nullable: true
  unique: false
  tests:
  - not_null
  observed_data_type: TIMESTAMPTZ
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 2
  sync_status: ok
