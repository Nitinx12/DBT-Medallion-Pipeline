apiVersion: 1.0.0
kind: DataContract
metadata:
  name: bronze.orders
  layer: bronze
  version: 1.0.0
  status: active
  owner: data-engineering
  domain: retail-ingestion
  description: Raw 1:1 mirror of MongoDB walmart.orders into Postgres bronze.orders.
dataset:
  server: postgres-prod
  database: walmart_db
  schema: bronze
  table: orders
  grain: one row per Mongo document (_id unique)
  upstream: mongodb.walmart.orders
  loadStrategy: incremental watermark pushdown + INSERT ... ON CONFLICT (_id) upsert
  watermarkColumn: updated_timestamp (fallback updated_at > created_timestamp > created_at)
  row_count: 1
  column_count_contract: 11
  column_count_observed: 11
  table_exists: true
  last_observed_at: '2026-10-13T14:51:42+00:00'
sla:
  freshness: incremental each pipeline run
  availability: table must be non-empty after extract
columns:
- name: _id
  data_type: TEXT
  nullable: false
  unique: true
  primary_key: true
  description: Mongo ObjectId serialized to string. Merge key + lineage only.
  tests:
