apiVersion: 1.0.0
kind: DataContract
metadata:
  name: bronze.employees
  layer: bronze
  version: 1.0.0
  status: active
  owner: data-engineering
  domain: retail-ingestion
  description: Raw 1:1 mirror of MongoDB walmart.employees into Postgres bronze.employees.
dataset:
