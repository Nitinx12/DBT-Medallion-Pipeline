apiVersion: 1.0.0
kind: DataContract
metadata:
  name: bronze.products
  layer: bronze
  version: 1.0.0
  status: active
  owner: data-engineering
  domain: retail-ingestion
  description: Raw 1:1 mirror of MongoDB walmart.products into Postgres bronze.products.
dataset:
  server: postgres-prod
  database: walmart_db
  schema: bronze
  table: products
  grain: one row per Mongo document (_id unique)
  upstream: mongodb.walmart.products
  loadStrategy: incremental watermark pushdown + INSERT ... ON CONFLICT (_id) upsert
  watermarkColumn: updated_timestamp (fallback updated_at > created_timestamp > created_at)
  row_count: 1
  column_count_contract: 9
  column_count_observed: 9
  table_exists: true
  last_observed_at: '2026-10-13T14:51:42+00:00'
sla:
  freshness: incremental each pipeline run
  availability: table must be non-empty after extract
columns:
- name: _id
  data_type: TEXT
  nullable: false
  unique: true
  primary_key: true
  description: Mongo ObjectId serialized to string. Merge key + lineage only.
  tests:
  - not_null
  - unique
  observed_data_type: TEXT
  observed_nullable: false
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 1
  sync_status: ok
- name: product_id
  data_type: BIGINT
  nullable: true
  unique: true
  description: Business key, raw as stored in Mongo (cast to INT only in silver).
  tests:
  - not_null
  - unique
  observed_data_type: BIGINT
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 1
  sync_status: ok
- name: product_name
  data_type: TEXT
  nullable: true
  unique: false
  description: Raw product name, untrimmed.
  tests:
  - not_null
  observed_data_type: TEXT
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 1
  sync_status: ok
- name: brand
  data_type: TEXT
  nullable: true
  unique: false
  description: Free-text brand. Normalized to silver.brands (INITCAP TRIM) in silver.
  observed_data_type: TEXT
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 1
  sync_status: ok
- name: category
  data_type: TEXT
  nullable: true
  unique: false
  description: Free-text category. Normalized to silver.categories in silver.
  tests:
  - not_null
  observed_data_type: TEXT
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 1
  sync_status: ok
- name: is_active
  data_type: TEXT
  nullable: true
  unique: false
  allowed_values:
  - Y
  - N
  description: Source flag Y/N. Converted to BOOLEAN only in silver.
  observed_data_type: TEXT
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 1
  sync_status: ok
- name: price
  data_type: FLOAT8
  nullable: true
  unique: false
  description: Raw as inferred by Spark; must be >= 0 once typed in silver.
  observed_data_type: FLOAT8
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 1
  sync_status: ok
- name: created_timestamp
  data_type: TEXT
  nullable: true
  unique: false
  description: Stored as 'YYYY-MM-DD HH:MM:SS' string in Mongo.
  tests:
  - not_null
  observed_data_type: TEXT
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 1
  sync_status: ok
- name: updated_timestamp
  data_type: TEXT
  nullable: true
  unique: false
  description: Watermark column, same string format.
  tests:
  - not_null
  observed_data_type: TEXT
  observed_nullable: true
  in_contract: true
  null_count: 0
  null_fraction: 0.0
  distinct_count: 1
  sync_status: ok
quality:
