# .github/labeler.yml — used by label workflow to auto-tag PRs by changed paths
extract: ["scripts/python/extract.py", "utils/engine.py", "utils/connection.py"]
dbt: ["dbt/**", "sql/**"]
airflow: ["airflow/**"]
docker: ["docker/**", "docker-compose.*", "Dockerfile*"]
tests: ["tests/**", "gx/**", "pipeline/data_quality/**"]
docs: ["docs/**", "*.md", "assets/**"]
ci: [".github/**", "Makefile", "pyproject.toml", "uv.lock"]
dashboard: ["dashboard/**"]
