# .github/labeler.yml — used by label workflow to auto-tag PRs by changed paths
extract: ["src/jobs/extract.py", "src/utils/engine.py", "src/utils/connection.py"]
dbt: ["dbt/**", "sql/**"]
airflow: ["airflow/**"]
docker: ["docker/**", "docker-compose.*", "Dockerfile*"]
tests: ["tests/**", "gx/**"]
docs: ["docs/**", "*.md", "assets/**"]
ci: [".github/**", "Makefile", "pyproject.toml", "uv.lock"]
dashboard: ["dashboard/**"]
src: ["src/**"]
