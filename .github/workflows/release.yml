name: Release

# Production release workflow — tag-driven, auditable, manual approval.
# Flow:  develop -> PR -> main -> tag vX.Y.Z -> this workflow builds & publishes versioned images
#         hotfix/* -> PR -> main -> tag vX.Y.Z -> same

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.2.0) — must match existing tag or will create one from main HEAD"
        required: true
        type: string

permissions:
  contents: write   # to create GitHub Release
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Enforce semver vMAJOR.MINOR.PATCH
          if ! echo "$VERSION" | grep -Eq "^v[0-9]+\.[0-9]+\.[0-9]+$"; then
            echo "::error::Tag '$VERSION' must be semver vMAJOR.MINOR.PATCH (e.g. v1.2.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

  build-and-publish:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-tag.outputs.version }}
          fetch-depth: 0
          # lfs: true — jars/*.jar are LFS objects baked into the images
          lfs: true

      - name: Lowercase repo owner (GHCR requires it)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata — walmart-pipeline
        id: meta-pipeline
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/walmart-pipeline
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build & push walmart-pipeline (versioned)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta-pipeline.outputs.tags }}
          labels: ${{ steps.meta-pipeline.outputs.labels }}
          cache-from: type=gha,scope=walmart-pipeline:ci
          cache-to: type=gha,mode=max,scope=walmart-pipeline:ci

      - name: Metadata — walmart-airflow
        id: meta-airflow
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/walmart-airflow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build & push walmart-airflow (versioned)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.airflow
          push: true
          tags: ${{ steps.meta-airflow.outputs.tags }}
          labels: ${{ steps.meta-airflow.outputs.labels }}
          cache-from: type=gha,scope=walmart-airflow:ci
          cache-to: type=gha,mode=max,scope=walmart-airflow:ci

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.version }}
          generate_release_notes: true
          body: |
            ### Docker images
            ```
            ghcr.io/${{ env.OWNER_LC }}/walmart-pipeline:${{ needs.validate-tag.outputs.version }}
            ghcr.io/${{ env.OWNER_LC }}/walmart-airflow:${{ needs.validate-tag.outputs.version }}
            ```
