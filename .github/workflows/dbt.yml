name: dbt

# Fast static feedback for dbt changes only — lint, parse, compile.
# No Postgres service, no seeds, no runs: the full medallion gate
# (seed bronze → run/test silver → run/test gold, same order as
# run_pipeline.ps1 stages 2–6) lives in ci.yml's `integration` job.
# This workflow must stay cheap and duplicate-free so a PR touching
# dbt/** doesn't spin up two parallel Postgres stacks.
on:
  push:
    branches: [main, develop]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "dbt/**"
      - ".github/workflows/dbt.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "dbt target"
        required: false
        default: "ci"
        type: choice
        options:
          - ci
          - dev

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dbt-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  DBT_PROFILES_DIR: ${{ github.workspace }}/docker/dbt
  PYTHONPATH: ${{ github.workspace }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen

      - name: sqlfluff lint
        run: uv run sqlfluff lint dbt/models --dialect postgres

      # NOTE: sqlfluff 4.x `format` has no dry-run flag (it rewrites files
      # in place), so there is no format *check* to gate on — `lint` above
      # already enforces layout/style rules. Do not re-add
      # `sqlfluff format ... --diff` here: that flag does not exist and
      # fails the job (exit code 2).

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      # parse needs only the project files + profiles.yml, no live DB —
      # so this job deliberately has no postgres service block.
      # (dbt compile/run/test DO need a DB; they live in ci.yml's
      # `integration` job, which seeds bronze and runs the full
      # silver → gold gate against a Postgres service.)
      - name: dbt parse
        working-directory: dbt
        run: uv run dbt parse --target ${{ inputs.target || 'ci' }}

      - name: upload compile artifacts (debug on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target-compile
          path: |
            dbt/target/
            dbt/logs/
          if-no-files-found: warn
          retention-days: 7
