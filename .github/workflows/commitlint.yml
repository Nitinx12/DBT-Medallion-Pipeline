name: Commit Lint

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages follow Conventional Commits
        run: |
          # Accepts BOTH schemes used in this repo:
          #   - Conventional types: feat, fix, docs, chore, refactor, test,
          #     ci, build, perf, style, revert
          #   - AGENTS.md area prefixes: extract, dbt, airflow, docker, tests,
          #     utils, docs, dashboard, pipeline, sql, gx, scripts, deps
          # Format: "<type|area>(optional scope): <summary>"
          # (Previously only Conventional types were accepted, so commits
          # following AGENTS.md — e.g. "extract: fall back to append-only" —
          # failed the gate. Both are now legal.)
          PATTERN='^(feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert|extract|dbt|airflow|docker|tests|utils|dashboard|pipeline|sql|gx|scripts|deps)(\(.+\))?: .+'

          echo "Checking commits in PR: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          # For PR, check all commits in the PR
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          # fallback if base/head not available (e.g. manual run)
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "No PR context — skipping commit lint (push to main/develop is checked via CI tag rules)."
            exit 0
          fi

          FAILED=0
          while read -r sha msg; do
            if ! echo "$msg" | grep -Eq "$PATTERN"; then
              echo "::error::Commit $sha does not follow the repo convention: '$msg'"
              echo "  Expected: '<type|area>(optional scope): <summary>' e.g. 'feat(extract): add watermark fallback' or 'extract: fall back to append-only'"
              echo "  Allowed: feat, fix, docs, chore, refactor, test, ci, build, perf, style, revert + areas extract, dbt, airflow, docker, tests, utils, dashboard, pipeline, sql, gx, scripts, deps"
              FAILED=1
            else
              echo "OK  $sha  $msg"
            fi
          done < <(git log --format="%H %s" "$BASE..$HEAD")

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Fix: git rebase -i $BASE  and rewrite messages, then force-push."
            exit 1
          fi
